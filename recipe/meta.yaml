{% set name = "tinytag" %}
{% set version = "2.2.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e6d06610ebe7cd66fd07be2d3b9495914ab32654a5e47657bb8cd44c2484523c

build:
  number: 0
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2
  run:
    - python

test:
  imports:
    - tinytag
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/tinytag/tinytag
  summary: Python library for reading audio file metadata
  description: |
    tinytag is a Python library for reading audio file metadata.
    It supports MP3, OGG, OPUS, MP4, M4A, FLAC, WMA, WAV, AIFF, and other formats.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/tinytag/tinytag
  dev_url: https://github.com/tinytag/tinytag

extra:
  recipe-maintainers:
    - pavelzw

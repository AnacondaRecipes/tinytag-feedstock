{% set name = "tinytag" %}
{% set version = "2.3.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 021d711cdbdbf840d3b67b976cb34dadc58d2fcfd490eb74ef9602b37b991414

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2
  run:
    - python

test:
  # Upstream test suite (tinytag/tests/) is excluded from the PyPI sdist, so only import and pip check can run.
  imports:
    - tinytag
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/tinytag/tinytag
  summary: Python library for reading audio file metadata
  description: |
    tinytag is a Python library for reading audio file metadata.
    It supports MP3, OGG, OPUS, MP4, M4A, FLAC, WMA, WAV, AIFF, and other formats.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/tinytag/tinytag
  dev_url: https://github.com/tinytag/tinytag

extra:
  recipe-maintainers:
    - pavelzw
